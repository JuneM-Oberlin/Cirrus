<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- green header bar -->
    <div class="header">
      <div class="header-tab active" id="tabToday" onclick="switchTab('today')">TODAY</div>
      <div class="header-tab" id="tabForecast" onclick="switchTab('forecast')">5-DAY FORECAST</div>
      <div class="header-city" id="cityName">--</div>
    </div>

    <!-- SEARCH ROW -->
    <div class="search-row">
      <input id="cityInput" type="text" placeholder="Enter city..."
             onkeydown="if(event.key === 'Enter') getWeather()">
      <button onclick="getWeather()">Search</button>
    </div>

    <div id="historyList" class="history"></div>

    <!-- loading + error — only once -->
    <div id="loading" class="hidden">Fetching weather...</div>
    <div id="errorMsg" class="error hidden"></div>

    <!-- TODAY VIEW -->
    <div id="todayView">
      <div id="weatherDisplay" class="weather-card hidden">
        <div class="card-left">
          <div id="tempMain" class="temp">--°</div>
          <div id="condition" class="condition">--</div>
        </div>
        <div id="weatherIcon" class="icon"></div>
        <div class="details-row">
          <div class="detail">
            <span class="detail-label">Feels Like</span>
            <span class="detail-val" id="feelsLike">--</span>
          </div>
          <div class="detail">
            <span class="detail-label">Humidity</span>
            <span class="detail-val" id="humidity">--</span>
          </div>
          <div class="detail">
            <span class="detail-label">Wind</span>
            <span class="detail-val" id="wind">--</span>
          </div>
        </div>
        <div class="wind-bar">
          <span class="wind-label">Wind Direction</span>
          <span class="wind-val" id="windDir">--</span>
          <span class="timestamp" id="timestamp">--</span>
        </div>
      </div>
    </div>

    <!-- FORECAST VIEW (hidden by default) -->
    <div id="forecastView" class="hidden">
      <div class="forecast-strip" id="forecastStrip"></div>
    </div>

  </div>

  <script src="config.js?v=20260523"></script>
  <script src="script.js?v=20260523"></script>
</body>
</html>
